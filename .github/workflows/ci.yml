name: CI

on:
  # Push only builds main. Branch pushes are covered by the pull_request event,
  # so listing branch prefixes here too meant every push to a branch with an
  # open PR ran this whole workflow twice - once per event - for no added
  # signal. main still builds on push so a merged commit is verified directly.
  push:
    branches: ["main"]
  pull_request:

# One run per ref at a time. A second push to a PR branch cancels the first
# still-running build instead of paying for both; main runs are left alone so a
# merge is always fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which validation a change needs is a deterministic function of the change: a
  # diff of only prose or local Claude settings cannot alter what the build,
  # tests, or scanners see, so the heavy jobs below can deterministically opt
  # out of it rather than re-derive an answer that cannot have moved.
  #
  # This is deliberately a JOB-level skip, not a workflow-level `paths-ignore`:
  # a required check whose whole workflow is filtered out stays "Pending" forever
  # and blocks the PR, whereas a job skipped by `if:` reports "Success". So the
  # gate saves the runner minutes without ever deadlocking a required check.
  determinism:
    name: Determine required validation
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Does anything but prose or local settings change?
        id: filter
        env:
          # PR: diff the head against the PR base. Push (main only): diff the
          # pushed range.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A branch's first push carries an all-zero before-SHA; fall back to
          # the head's parent so the diff still computes.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo "${HEAD_SHA}")"
          fi
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "changed files:"
          echo "${changed}"
          # Paths that cannot affect the build: all markdown (docs, and every
          # agent-facing role/goal/backstory/task/SKILL prose file, which are
          # all .md), and everything under .claude/ (hooks, settings, skills).
          # If the changeset is nothing but these, code stays false and the
          # heavy jobs skip.
          build_relevant="$(printf '%s\n' "${changed}" | grep -vE '(\.md$|^\.claude/)' || true)"
          if [ -n "${build_relevant}" ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  lint:
    name: Lint & type-check
    needs: [determinism]
    if: needs.determinism.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff - lint
        run: ruff check .

      - name: ruff - format check
        run: ruff format --check .

      - name: mypy - type check
        run: mypy . --ignore-missing-imports

      - name: pylint - design rules
        run: pylint .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [determinism, lint]
    if: needs.determinism.outputs.code == 'true'
    permissions:
      contents: read
      checks: write  # required by dorny/test-reporter to post check runs
    env:
      # Dummy creds so H1Client can be imported without KeyError. The contact
      # email seeds the User-Agent helper - see tools/http.py and #46.
      H1_API_USERNAME: ci-user
      H1_API_TOKEN: ci-token
      CYBERSQUAD_CONTACT_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # diff-cover compares PR HEAD against the base branch; without
          # the base ref in the local clone the gate cannot compute a
          # diff. fetch-depth: 0 grabs full history once - the repo is
          # small and this is simpler than a separate ``git fetch
          # origin <base-ref>`` step that has to handle every base.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit only)
        run: pytest -m unit --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --junit-xml=junit.xml

      - name: Diff coverage (per-PR ratchet)
        # Fails when a line added or modified by the PR is not covered by
        # tests (--fail-under=100 on the diff, not the whole codebase).
        # Stacked on top of the absolute fail_under floor in pyproject.toml:
        # the floor catches large drops, this catches slow drift on touched
        # lines. PR-only - on push-to-branch events there is no base ref
        # to diff against and the gate would always trivially pass.
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=100

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        if: always()
        with:
          name: pytest results
          path: junit.xml
          reporter: java-junit

      - name: Upload coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true

  sast:
    name: SAST
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `determinism`: this job uploads bandit/semgrep
    # SARIF, and code-scanning results are evaluated at branch level with
    # different rules than a plain status check. Skipping it on a prose-only
    # change could leave a "require code scanning results" rule unsatisfied, so
    # it always runs. The lint and test jobs, which are ordinary status checks,
    # are the ones the determinism gate skips.
    permissions:
      contents: read
      security-events: write  # required by github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install SAST tools
        run: pip install 'bandit[toml,sarif]' semgrep

      - name: bandit - security lint
        run: bandit -c pyproject.toml -r . -f sarif -o bandit.sarif -q

      - name: Upload bandit SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: semgrep - SAST scan
        if: always()
        run: semgrep scan --config=.semgrep.yml --error --quiet --sarif-output=semgrep.sarif

      - name: Upload semgrep SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
